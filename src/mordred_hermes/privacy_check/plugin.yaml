# Mordred plugin manifest. Hermes core ignores unknown fields; `privacy_lock`
# is a Mordred-internal hint used by sibling plugins to detect peer disable
# (TODO §1.1 H3 Path B / SPEC §Plugin-disable protection Tier A).
name: mordred_privacy_check
version: 0.1.0a5
description: Skill metadata enforcement and audit logging for Mordred
author: InternetMaximalism
privacy_lock: true
config_schema:
  type: object
  additionalProperties: false
  properties:
    policy:
      enum: [strict, lenient, off]
      default: lenient
    allow_cloud_llm:
      type: boolean
      default: false
    cloud_provider_allowlist:
      type: array
      items: { type: string }
      default: []
    audit_log_path:
      type: string
      description: Override audit log path. Default ~/.hermes/mordred/audit.log.
