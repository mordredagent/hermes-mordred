    <script>
      // The launcher delivers the page principal in a URL fragment. Keep it
      // only in this tab's sessionStorage so a same-tab reload can reconnect;
      // fragments are never sent in HTTP requests or Referer headers.
      const pageTokenStorageKey = 'mordred-page-token'
      const injectedPageToken = '%%MORDRED_PAGE_TOKEN%%'
      const launchParams = new URLSearchParams(window.location.hash.slice(1))
      const launchToken = launchParams.get('token') || ''
      const compatibleInjectedToken = injectedPageToken.includes('%%') ? '' : injectedPageToken
      let pageToken = launchToken || compatibleInjectedToken
      let privateUrlMode = Boolean(launchToken)
      try {
        if (pageToken) {
          window.sessionStorage.setItem(pageTokenStorageKey, pageToken)
        } else {
          pageToken = window.sessionStorage.getItem(pageTokenStorageKey) || ''
          privateUrlMode = Boolean(pageToken)
        }
      } catch {
        // Storage may be disabled. A launch-fragment token still works for the
        // current load; an empty token stays empty and is never reload-looped.
      }
      window.__MORDRED_PAGE_TOKEN__ = pageToken
      if (window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search)
      }
      // Older Hermes builds replace the placeholder above on every response,
      // so their normal reload path remains intact. Private-URL mode cannot
      // acquire a fresh token by reloading and instead returns to the launcher.
      if (privateUrlMode) {
        window.__MORDRED_HANDLE_AUTH_FAILURE__ = () => {
          try {
            window.sessionStorage.removeItem(pageTokenStorageKey)
            window.sessionStorage.removeItem('mordred-page-auth-reload')
          } catch {
            // Storage may be unavailable; still invalidate the in-memory token.
          }
          window.__MORDRED_PAGE_TOKEN__ = ''
          const notice = document.createElement('main')
          notice.setAttribute('role', 'alert')
          notice.style.cssText =
            'max-width:42rem;margin:15vh auto;padding:2rem;font:16px/1.6 system-ui;color:#e7e9ee;background:#15171f;border:1px solid #2a2e3c;border-radius:10px'
          notice.textContent =
            'Mordred authentication expired. Open the new private URL shown by the launcher.'
          document.body.replaceChildren(notice)
        }
      }
    </script>
