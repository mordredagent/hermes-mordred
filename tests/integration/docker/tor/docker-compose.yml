# PR3b: hermetic Tor container for mordred-hermes integration tests.
#
# Bind 127.0.0.1:9050 only — never the all-interfaces 0.0.0.0 — so
# the SOCKS port is unreachable to anything but the test runner. The
# container runs unprivileged and is fully ephemeral (no volumes);
# `compose down --volumes` reaps everything between test modules.

services:
  tor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mordred-hermes-pr3b-tor
    ports:
      - "127.0.0.1:9050:9050"
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'Bootstrapped 100%' /var/log/tor/notices.log"]
      interval: 5s
      timeout: 3s
      # 30s start + 45x5s covers the harness's 240s per-attempt
      # bootstrap deadline (tests/integration/_docker.py), so the
      # container is not flagged unhealthy while a slow-but-live
      # bootstrap is still inside its budget.
      retries: 45
      start_period: 30s
    restart: "no"
