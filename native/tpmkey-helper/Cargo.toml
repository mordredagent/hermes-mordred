[package]
name = "mordred-hermes-tpmkey"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "TPM 2.0 hardware-key helper for the Mordred keyvault (Linux). Speaks the same JSON-over-stdio protocol as the macOS Secure-Enclave helper (mordred-hermes-sekey)."
license = "MIT"
publish = false

[lib]
name = "mordred_hermes_tpmkey"
path = "src/lib.rs"

[[bin]]
name = "mordred-hermes-tpmkey"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# --- Phase 2b (Linux TPM backend) — NOT YET ADDED ---
# The real TPM operations (CreatePrimary / Create / ECDH_ZGen / FlushContext)
# will live in `src/tpm.rs` behind `#[cfg(target_os = "linux")]`. They require
# `tss-esapi`, which links libtss2 and only builds on Linux:
#
#     [target.'cfg(target_os = "linux")'.dependencies]
#     tss-esapi = "7"   # verify the exact API at 2b time (TCG TPM 2.0 Part 3)
#
# Keeping it out until then lets the pure-function layer below build and
# `cargo test` on ANY host (incl. the macOS dev box); the binary reports the
# neutral `UNAVAILABLE` reason at runtime until the backend is wired.

[profile.release]
strip = true
lto = true
