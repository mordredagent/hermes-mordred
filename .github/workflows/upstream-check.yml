name: Upstream drift check

# Detects hook-name and payload drift in both the current hermes-agent PyPI
# package and the latest upstream main checkout. It also runs Mordred's
# agent-memory seam canary against main, so upstream call-shape drift is caught
# before that checkout is packaged.

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  drift_check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pypi_status: ${{ steps.drift.outputs.pypi_status }}
      main_status: ${{ steps.drift.outputs.main_status }}
      main_memory_status: ${{ steps.drift.outputs.main_memory_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upstream-main canary below executes code from another
          # repository. Do not leave this job's read-only token on disk for it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install current Hermes and Mordred canary dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          pip install -e ".[dev,keyvault]"

      - name: Clone latest Hermes main
        run: git clone --depth 1 --branch main https://github.com/NousResearch/hermes-agent.git hermes-upstream

      - name: Check hook contract against PyPI and main
        id: drift
        run: |
          SITE_PACKAGES="$(python -c 'import hermes_cli, os; print(os.path.dirname(os.path.dirname(hermes_cli.__file__)))')"
          if python tools/check_hook_payload_drift.py --hermes-root "$SITE_PACKAGES" --contract tools/hook_payload_contract.json > pypi_drift.txt; then
            pypi_status=ok
          else
            pypi_status=drift
          fi
          if python tools/check_hook_payload_drift.py --hermes-root hermes-upstream --contract tools/hook_payload_contract.json > main_drift.txt; then
            main_status=ok
          else
            main_status=drift
          fi
          mkdir -p "$RUNNER_TEMP/mordred-memory-canary-home"
          if env \
            PYTHONPATH="$GITHUB_WORKSPACE/hermes-upstream:$GITHUB_WORKSPACE/src" \
            HERMES_HOME="$RUNNER_TEMP/mordred-memory-canary-home" \
            MORDRED_REQUIRE_UPSTREAM_MEMORY_SEAMS=1 \
            python -m pytest -q tests/test_keyvault_memory_hook_canary.py > main_memory_canary.txt 2>&1; then
            main_memory_status=ok
          else
            main_memory_status=drift
          fi
          {
            echo "pypi_status=$pypi_status"
            echo "main_status=$main_status"
            echo "main_memory_status=$main_memory_status"
          } >> "$GITHUB_OUTPUT"
          echo "PyPI hook contract: $pypi_status"
          echo "upstream-main hook contract: $main_status"
          echo "upstream-main memory canary: $main_memory_status"

  report:
    needs: drift_check
    if: >-
      needs.drift_check.outputs.pypi_status != 'ok' ||
      needs.drift_check.outputs.main_status != 'ok' ||
      needs.drift_check.outputs.main_memory_status != 'ok'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      # This job runs on a fresh runner and never checks out or executes
      # upstream code. It accepts only the three exact status classes below;
      # raw upstream output never crosses into this privileged job.
      - name: File or update drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PYPI_STATUS: ${{ needs.drift_check.outputs.pypi_status }}
          MAIN_STATUS: ${{ needs.drift_check.outputs.main_status }}
          MAIN_MEMORY_STATUS: ${{ needs.drift_check.outputs.main_memory_status }}
        with:
          script: |
            const checks = [
              ["Current PyPI `hermes-agent` hook contract", process.env.PYPI_STATUS],
              ["Latest `NousResearch/hermes-agent` main hook contract", process.env.MAIN_STATUS],
              ["Latest upstream-main agent-memory seam canary", process.env.MAIN_MEMORY_STATUS],
            ];
            const failed = checks
              .filter(([, status]) => status !== "ok")
              .map(([label]) => `- ${label}`);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Weekly upstream drift check found a Hermes compatibility mismatch. This report is informational; Mordred does not send upstream PRs.",
              "",
              ...failed,
              "",
              `The unprivileged check job records the failing check class: ${runUrl}`,
            ].join("\n");

            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-drift",
            });
            const existing = data.length > 0 ? data[0].number : null;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Hermes upstream drift detected",
                body,
                labels: ["actionable", "upstream-drift"],
              });
            }
