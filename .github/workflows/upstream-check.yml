name: Upstream drift check

# Detects Hermes (hermes-agent) upstream drift that would silently break
# Mordred's plugin hooks: (1) hook *names* Mordred registers disappearing
# from hermes_cli.plugins.VALID_HOOKS, and (2) hook *payload fields*
# Mordred consumes disappearing from a dispatch site (tools/hook_payload_contract.json).
#
# Standalone-repo adaptation (docs/dev/CI.md): the pre-split design
# `git clone`d the Hermes upstream source tree. hermes-agent now ships on
# PyPI, so this just `pip install`s it and points the payload-drift
# scanner at the installed package's site-packages directory (which has
# the same agent/, gateway/, hermes_cli/, tools/ layout as a source
# checkout — the AST scanner only needs .py files, not an execution).

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hermes-agent (PyPI) + mordred-hermes
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent
          pip install -e .

      - name: Check hook name drift
        id: names
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import subprocess
          import sys

          try:
              from hermes_cli.plugins import VALID_HOOKS
          except ImportError:
              print("status=removed")
              sys.exit(0)

          registered = set(
              subprocess.run(
                  ["git", "grep", "-hoE", r'register_hook\(\s*"[a-z_]+"', "--", "src/mordred_hermes"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.splitlines()
          )
          registered = {line.split('"')[1] for line in registered}
          missing = sorted(registered - set(VALID_HOOKS))
          if missing:
              print(f"status=drift")
              print(f"missing={','.join(missing)}")
          else:
              print("status=ok")
          PY

      - name: Check hook payload field drift
        id: payload
        run: |
          SITE_PACKAGES="$(python -c 'import hermes_cli, os; print(os.path.dirname(os.path.dirname(hermes_cli.__file__)))')"
          if python tools/check_hook_payload_drift.py --hermes-root "$SITE_PACKAGES" --contract tools/hook_payload_contract.json > payload_drift.txt; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=drift" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing upstream-drift issue
        if: steps.names.outputs.status != 'ok' || steps.payload.outputs.status != 'ok'
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-drift",
            });
            core.setOutput("number", data.length > 0 ? data[0].number : "");

      - name: Build drift report
        if: steps.names.outputs.status != 'ok' || steps.payload.outputs.status != 'ok'
        id: report
        env:
          NAMES_STATUS: ${{ steps.names.outputs.status }}
          NAMES_MISSING: ${{ steps.names.outputs.missing }}
          PAYLOAD_STATUS: ${{ steps.payload.outputs.status }}
        run: |
          {
            echo "body<<REPORT_EOF"
            echo "Weekly upstream drift check found a mismatch against the installed \`hermes-agent\` package."
            echo
            if [ "$NAMES_STATUS" = "removed" ]; then
              echo "- \`hermes_cli.plugins.VALID_HOOKS\` no longer exists (upstream renamed/removed the constant)."
            elif [ "$NAMES_STATUS" = "drift" ]; then
              printf -- '- Hook names Mordred registers but upstream no longer defines: `%s`\n' "$NAMES_MISSING"
            fi
            if [ "$PAYLOAD_STATUS" = "drift" ]; then
              echo
              echo "Hook payload field drift (see \`tools/check_hook_payload_drift.py\` output):"
              echo '```'
              cat payload_drift.txt
              echo '```'
            fi
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: File or update drift issue
        if: steps.names.outputs.status != 'ok' || steps.payload.outputs.status != 'ok'
        uses: actions/github-script@v7
        env:
          DRIFT_BODY: ${{ steps.report.outputs.body }}
          EXISTING_ISSUE: ${{ steps.existing.outputs.number }}
        with:
          script: |
            const body = process.env.DRIFT_BODY;
            const existing = process.env.EXISTING_ISSUE;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(existing),
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Hermes upstream drift detected",
                body,
                labels: ["actionable", "upstream-drift"],
              });
            }
