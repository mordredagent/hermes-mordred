name: Upstream drift check

# Static release/main scans plus selected-source memory seams under Python 3.12.
# Upstream code executes only in the read-only job; diagnostics stay in its logs.
on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HERMES_HOME: ${{ github.workspace }}/.canary-home
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      pypi_status: ${{ steps.ast.outputs.pypi_status }}
      main_status: ${{ steps.ast.outputs.main_status }}
      memory_status: ${{ steps.memory.outputs.memory_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install current hermes-agent from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install hermes-agent
      - name: Clone latest Hermes main
        run: |
          git clone --depth 1 --branch main https://github.com/NousResearch/hermes-agent.git hermes-upstream
          git -C hermes-upstream rev-parse HEAD
      - name: Check hook contract against PyPI and main before source overlay
        id: ast
        shell: bash
        run: |
          SITE_PACKAGES="$(python -c 'import hermes_cli, pathlib; print(pathlib.Path(hermes_cli.__file__).resolve().parent.parent)')"
          scan() {
            local code=0 status
            python tools/check_hook_payload_drift.py --hermes-root "$2" --contract tools/hook_payload_contract.json > "$1_drift.txt" 2>&1 || code=$?
            case "$code" in 0) status=ok;; 1) status=drift;; *) status=unavailable;; esac
            cat "$1_drift.txt"
            echo "$1_status=$status" >> "$GITHUB_OUTPUT"
          }
          scan pypi "$SITE_PACKAGES"
          scan main hermes-upstream
      - name: Prepare disposable selected-source canary
        run: |
          python -m venv "$RUNNER_TEMP/memory-canary"
          "$RUNNER_TEMP/memory-canary/bin/python" -m pip install -e '.[dev,keyvault]'
          "$RUNNER_TEMP/memory-canary/bin/python" - <<'PY'
          import pathlib, sysconfig
          root = str(pathlib.Path('hermes-upstream').resolve())
          overlay = pathlib.Path(sysconfig.get_paths()['purelib']) / '00_mordred_upstream_canary.pth'
          overlay.write_text('import sys; sys.path.insert(0, ' + repr(root) + ')\n', encoding='utf-8')
          PY
      - name: Execute actual upstream memory and Journey guards
        id: memory
        env:
          MORDRED_REQUIRE_UPSTREAM_MEMORY_SEAMS: "1"
          MORDRED_EXPECTED_UPSTREAM_ROOT: ${{ github.workspace }}/hermes-upstream
        shell: bash
        run: |
          code=0
          "$RUNNER_TEMP/memory-canary/bin/python" tools/upstream_memory_canary.py --status-file "$RUNNER_TEMP/memory-status.txt" > memory_canary.txt 2>&1 || code=$?
          cat memory_canary.txt
          status=unavailable
          recorded="$(cat "$RUNNER_TEMP/memory-status.txt" 2>/dev/null || true)"
          if [ "$code" = 0 ] && [ "$recorded" = ok ]; then status=ok; fi
          if [ "$code" = 1 ] && [ "$recorded" = drift ]; then status=drift; fi
          echo "memory_status=$status" >> "$GITHUB_OUTPUT"

  report:
    needs: drift-check
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      # Fresh runner: no checkout, cache, artifacts or upstream execution.
      - name: File or update local compatibility issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_RESULT: ${{ needs.drift-check.result }}
          PYPI_STATUS: ${{ needs.drift-check.outputs.pypi_status }}
          MAIN_STATUS: ${{ needs.drift-check.outputs.main_status }}
          MEMORY_STATUS: ${{ needs.drift-check.outputs.memory_status }}
        with:
          script: |
            const normalize = value => value === "ok" || value === "drift" ? value : "unavailable";
            const result = process.env.CHECK_RESULT === "success" ? "success" : "unavailable";
            const statuses = [process.env.PYPI_STATUS, process.env.MAIN_STATUS, process.env.MEMORY_STATUS].map(normalize);
            if (result === "success" && statuses.every(value => value === "ok")) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Weekly Hermes compatibility check. Informational only; Mordred does not send upstream PRs.",
              "",
              `Execution: ${result}.`,
              `PyPI hook contract: ${statuses[0]}.`,
              `Main hook contract: ${statuses[1]}.`,
              `Main memory/Journey seams: ${statuses[2]}.`,
              "",
              "Unavailable means preparation, dependencies or execution could not establish compatibility. Drift means a contract or behavior check failed.",
              `Diagnostics and selected source provenance: ${runUrl}`,
            ].join("\n");
            const target = {owner: context.repo.owner, repo: context.repo.repo};
            const {data} = await github.rest.issues.listForRepo({...target, state: "open", labels: "upstream-drift"});
            if (data.length) {
              await github.rest.issues.createComment({...target, issue_number: data[0].number, body});
            } else {
              await github.rest.issues.create({...target, title: "Hermes upstream compatibility report", body, labels: ["actionable", "upstream-drift"]});
            }
