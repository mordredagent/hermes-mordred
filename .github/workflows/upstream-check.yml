name: Upstream drift check

# Detects hook-name and payload drift in both the current hermes-agent PyPI
# package and the latest upstream main checkout. The AST scanner imports
# neither target, so main can be checked before it is packaged or installable.

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install current hermes-agent from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install hermes-agent

      - name: Clone latest Hermes main
        run: git clone --depth 1 --branch main https://github.com/NousResearch/hermes-agent.git hermes-upstream

      - name: Check hook contract against PyPI and main
        id: drift
        run: |
          SITE_PACKAGES="$(python -c 'import hermes_cli, os; print(os.path.dirname(os.path.dirname(hermes_cli.__file__)))')"
          if python tools/check_hook_payload_drift.py --hermes-root "$SITE_PACKAGES" --contract tools/hook_payload_contract.json > pypi_drift.txt; then
            echo "pypi_status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "pypi_status=drift" >> "$GITHUB_OUTPUT"
          fi
          if python tools/check_hook_payload_drift.py --hermes-root hermes-upstream --contract tools/hook_payload_contract.json > main_drift.txt; then
            echo "main_status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "main_status=drift" >> "$GITHUB_OUTPUT"
          fi

      - name: Find existing upstream-drift issue
        if: steps.drift.outputs.pypi_status != 'ok' || steps.drift.outputs.main_status != 'ok'
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream-drift",
            });
            core.setOutput("number", data.length > 0 ? data[0].number : "");

      - name: Build drift report
        if: steps.drift.outputs.pypi_status != 'ok' || steps.drift.outputs.main_status != 'ok'
        id: report
        env:
          PYPI_STATUS: ${{ steps.drift.outputs.pypi_status }}
          MAIN_STATUS: ${{ steps.drift.outputs.main_status }}
        run: |
          {
            echo "body<<REPORT_EOF"
            echo "Weekly upstream drift check found a Hermes hook-contract mismatch. This report is informational; Mordred does not send upstream PRs."
            echo
            if [ "$PYPI_STATUS" = "drift" ]; then
              echo "Current PyPI \`hermes-agent\`:"
              echo '```'
              cat pypi_drift.txt
              echo '```'
            fi
            if [ "$MAIN_STATUS" = "drift" ]; then
              echo
              echo "Latest \`NousResearch/hermes-agent\` main:"
              echo '```'
              cat main_drift.txt
              echo '```'
            fi
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: File or update drift issue
        if: steps.drift.outputs.pypi_status != 'ok' || steps.drift.outputs.main_status != 'ok'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRIFT_BODY: ${{ steps.report.outputs.body }}
          EXISTING_ISSUE: ${{ steps.existing.outputs.number }}
        with:
          script: |
            const body = process.env.DRIFT_BODY;
            const existing = process.env.EXISTING_ISSUE;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(existing),
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "Hermes upstream drift detected",
                body,
                labels: ["actionable", "upstream-drift"],
              });
            }
