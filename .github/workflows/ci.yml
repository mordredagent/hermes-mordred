name: CI

# Restored after the Mordred-Hermes-monorepo -> standalone-repo split
# (2026-06-30/07-01). See docs/dev/CI.md for the full policy this
# implements, and the "Standalone-repo adaptations" note at the top of
# that doc for what changed vs. the pre-split design (chiefly: hermes-agent
# now ships on PyPI, so the old "install hermes-agent from the monorepo
# root, then install mordred-hermes" step is gone).

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "native/**"
      - "packaging/**"
      - "scripts/**"
      - "skills/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - ".github/labeler.yml"
  push:
    branches: [main, dev]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "native/**"
      - "packaging/**"
      - "scripts/**"
      - "skills/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
      - ".github/labeler.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job here only reads the checked-out source
# (lint/type-check/test/build), so the default GITHUB_TOKEN is scoped down
# to read-only least privilege.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        # 3.13 added 2026-07-15 (newly added cell — watch for a cycle: wheels
        # for pyobjc>=10 / blake3 are expected to exist already, but a fresh
        # CPython release can still lag on some platform). fail-fast is
        # already false, so a 3.13-only failure won't block 3.11/3.12.
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # hermes-agent is a normal PyPI dependency (pyproject.toml pins
      # `hermes-agent>=0.13.0`) so `pip install -e .` resolves it directly —
      # no monorepo root install step needed.
      - name: Install mordred-hermes (dev + keyvault + extension extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,keyvault,extension]"

      # macos extra = keyvault extra + Phase 4 pyobjc Security/SystemConfiguration/Quartz
      # bridges; only meaningful (and only installable) on macOS.
      - name: Install macOS extra
        if: runner.os == 'macOS'
        run: pip install -e ".[macos]"

      - name: SKILL.md drift guard (mordred-status)
        # Nothing else validates skills/mordred-status/SKILL.md against the
        # live CLI, so a wizard/_cli_parsers.py rename would regress
        # silently; exit code 2 (policy would block it) also fails this step.
        run: hermes-mordred policy dry-run skills/mordred-status

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

      - name: mypy --strict
        run: mypy --strict src tools

      - name: pytest
        env:
          # README.md's documented canonical test invocation always pins
          # HERMES_HOME to an isolated path — without it, _home.py's
          # module-level HERMES_BASE resolves against the runner's real
          # $HOME/.hermes instead of a throwaway directory.
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        run: pytest -q --cov=mordred_hermes --cov-report=xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Optional feature dependencies used to be absent from every ordinary CI
  # environment, so pytest.importorskip could make the Ethereum suites vanish
  # without a red check. Install the declared extras explicitly, prove their
  # imports are present, exercise the QR implementation, then run the focused
  # feature suites with skip reasons visible.
  feature-extras:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ethereum, messaging, and Tor-control extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,keyvault,extension,ethereum,messaging,tor-control]"

      - name: Require and exercise every feature dependency
        run: |
          python - <<'PY'
          import contextlib
          import io

          import eth_account
          import eth_keys
          import qrcode
          import requests
          import rlp
          import socks
          import urllib3
          from stem.control import Controller

          from mordred_hermes.wizard.extension_pair_cli import _print_qr

          assert eth_account.Account
          assert eth_keys.keys.PrivateKey
          assert requests.Session
          assert rlp.encode
          assert socks.socksocket
          assert urllib3.HTTPSConnectionPool
          assert callable(Controller.from_port)

          qr = qrcode.QRCode(border=1)
          qr.add_data("MORT-CI000000-CI000000")
          qr.make(fit=True)
          assert qr.get_matrix()

          rendered = io.StringIO()
          with contextlib.redirect_stdout(rendered):
              _print_qr("MORT-CI000000-CI000000")
          assert rendered.getvalue().strip(), "messaging extra did not render a QR"
          PY

      - name: Run feature-extra suites
        env:
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        run: |
          pytest -q -rs \
            tests/test_keyvault_ethereum.py \
            tests/test_keyvault_bip32.py \
            tests/test_wizard_keyvault_eth_cli.py \
            tests/extension/test_extension_sign_tx.py \
            tests/test_paths_tor.py \
            tests/test_wizard_extension_pair_cli.py

  # Build by the same sdist -> wheel path used by release.yml, install that
  # wheel into a fresh venv outside the checkout, and smoke the public package
  # contract. This catches files that editable installs accidentally mask.
  package-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel from that sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Fresh-install and smoke entry points plus shipped assets
        env:
          SMOKE_VENV: ${{ runner.temp }}/mordred-wheel-smoke
          SMOKE_HOME: ${{ runner.temp }}/mordred-wheel-home
        run: |
          set -euo pipefail
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -type f)"
          wheel_count="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')"
          if [ "$wheel_count" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            exit 1
          fi

          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          "$SMOKE_VENV/bin/python" -m pip install "${wheel_path}[keyvault,extension]"
          cd "$RUNNER_TEMP"

          HERMES_HOME="$SMOKE_HOME" "$SMOKE_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import os
          from pathlib import Path
          import sysconfig

          import mordred_hermes
          import mordred_hermes.extension.rpc
          import requests
          import socks
          import urllib3

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          package_file = Path(mordred_hermes.__file__).resolve()
          assert not package_file.is_relative_to(checkout), package_file
          assert requests.Session
          assert socks.socksocket
          assert urllib3.HTTPSConnectionPool

          dist = importlib.metadata.distribution("mordred-hermes")
          plugin_eps = {
              ep.name: ep
              for ep in dist.entry_points
              if ep.group == "hermes_agent.plugins"
          }
          expected_plugins = {
              "mordred_e2e",
              "mordred_keyvault",
              "mordred_llm_guard",
              "mordred_network",
              "mordred_privacy_check",
              "mordred_wizard",
          }
          assert set(plugin_eps) == expected_plugins
          for name, entry_point in plugin_eps.items():
              module = entry_point.load()
              assert callable(getattr(module, "register", None)), name

          console_eps = {
              ep.name: ep
              for ep in dist.entry_points
              if ep.group == "console_scripts"
          }
          assert "hermes-mordred" in console_eps
          assert callable(console_eps["hermes-mordred"].load())

          package_root = importlib.resources.files("mordred_hermes")
          required_assets = (
              "_native/sekey-helper/build.sh",
              "_native/sekey-helper/Package.swift",
              "_native/tpmkey-helper/Cargo.lock",
              "_offline/keyvault_offline_digest.py",
              "extension/web/index.html",
          )
          for relative in required_assets:
              assert package_root.joinpath(relative).is_file(), relative

          pth = (
              Path(sysconfig.get_paths()["purelib"])
              / "mordred_hermes_config_decrypt.pth"
          )
          assert pth.is_file(), pth
          print(f"Installed wheel package: {package_file}")
          print(f"Validated plugins: {sorted(plugin_eps)}")
          print(f"Validated .pth: {pth}")
          PY

          HERMES_HOME="$SMOKE_HOME" "$SMOKE_VENV/bin/hermes-mordred" --version

  # H1 floor guarantee: pyproject.toml declares `hermes-agent>=0.13.0`, but
  # every other job in this workflow resolves the latest PyPI hermes-agent,
  # so the declared floor itself is never actually exercised — a Mordred
  # API usage that only works on a newer hermes-agent could silently
  # violate the floor. Pin hermes-agent to exactly 0.13.0 first, install
  # mordred-hermes on top of it, verify the resolver left the pin alone
  # (pip could otherwise "helpfully" upgrade it while still satisfying the
  # >=0.13.0 constraint), and run the unit suite against that exact
  # combination. Standalone job (no `needs:`) so it runs in parallel with
  # `test` for fast feedback; it is not a required branch-protection check.
  #
  # Why 0.13.0: this job's own first run (2026-07-15) proved the previous
  # declared floor of 0.11.0 was uninstallable — hermes-agent's PyPI
  # history starts at 0.13.0 (0.11.x/0.12.x were source-install-era
  # versions, never published). 0.13.0 passes the full compat suite
  # (verified locally before raising the floor in pyproject.toml).
  hermes-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pin hermes-agent to the declared floor (0.13.0)
        run: |
          python -m pip install --upgrade pip
          pip install "hermes-agent==0.13.0"

      - name: Install mordred-hermes (dev + keyvault + extension extras)
        run: pip install -e ".[dev,keyvault,extension]"

      - name: Guard — resolver must not have upgraded hermes-agent off the floor
        run: |
          set -euo pipefail
          INSTALLED_VERSION="$(python -c 'import importlib.metadata as m; print(m.version("hermes-agent"))')"
          if [ "$INSTALLED_VERSION" != "0.13.0" ]; then
            echo "::error::hermes-agent floor test is void: resolver left hermes-agent at $INSTALLED_VERSION instead of the pinned 0.13.0, so pyproject.toml's declared floor was not actually exercised."
            exit 1
          fi

      - name: pytest against the hermes-agent floor
        env:
          # Isolate _home.py's HERMES_BASE from the runner's real $HOME
          # (same rationale as the test job above).
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        # Two tests are deselected because they are latest-tracking drift
        # detectors, not compatibility tests — including them would force
        # floor == latest forever (a treadmill, defeating this job):
        #   - test_replica_matches_hermes_source requires the vendored
        #     provider replica to byte-match the INSTALLED hermes source;
        #     the replica deliberately tracks PyPI-latest, so it can never
        #     match a pinned old floor.
        #   - test_known_provider_slugs_are_real_hermes_ids requires
        #     provider ids (vertex/novita) that hermes-agent only
        #     recognises from 0.18.0 (per its own docstring).
        # Both still run at latest in the `test` job. If either is renamed,
        # pytest silently re-includes it here and this job goes red —
        # loud in the right direction.
        run: >-
          pytest -q
          --deselect tests/test_provider_identity.py::test_replica_matches_hermes_source
          --deselect tests/test_provider_transport_flagger.py::TestRegistrySync::test_known_provider_slugs_are_real_hermes_ids

  # Hermetic Tor integration tests (Docker-backed; Linux only — macOS
  # runners have no Docker). The socks5h / provider-transport suites are
  # hermetic (no Docker) but consume the `integration` extra, so they
  # ride this job.
  integration-tor:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # `integration` extra carries the SOCKS client libraries and
      # provider SDKs the §0.8 verification suites need. hermes-agent
      # resolves from PyPI — no monorepo root install step.
      - name: Install mordred-hermes (dev + integration extras)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,integration]"

      - name: Verify docker compose is available
        run: |
          docker --version
          docker compose version
          docker info --format '{{.ServerVersion}}'

      - name: Build Tor integration image
        working-directory: tests/integration/docker/tor
        run: docker compose build

      - name: Run Tor + SOCKS5h + provider transport integration tests
        env:
          # Isolate _home.py's HERMES_BASE from the runner's real $HOME
          # (same rationale as the test job above).
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        # `-m integration` overrides the default `-m "not integration"`
        # from pyproject.toml so the suites actually run here.
        run: |
          pytest -v -m integration \
            tests/integration/test_tor.py \
            tests/integration/test_socks5h_libs.py \
            tests/integration/test_provider_transport.py

  # The macOS Secure Enclave helper is shipped as Swift source in the wheel.
  # Compile it on a real macOS runner so source/API drift cannot reach users
  # unnoticed. Runtime Secure Enclave operations remain hardware-gated.
  sekey-helper:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/sekey-helper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift toolchain info
        run: swift --version

      - name: Build Secure Enclave helper
        run: swift build -c release

  # v2-OS2 tpmkey-helper: the native/tpmkey-helper Rust crate (Linux TPM 2.0
  # helper). Covers fmt + clippy + the pure, host-agnostic layer (wire protocol,
  # SEC1 codec, 32-byte ECDH-Z left-pad, blob store, neutral error taxonomy) on
  # BOTH Linux and macOS — proving the cross-platform build claim on real Linux,
  # which the macOS dev host cannot. On Linux it additionally COMPILES the
  # tss-esapi TPM backend (Phase 2b), so libtss2 + libclang are installed there;
  # macOS excludes the backend via cfg. The backend's live tests are gated on
  # MORDRED_TPM_TEST and run in the swtpm-backed tpmkey-helper-tpm job below.
  # Runs independently of the Python matrix; runners ship a stable Rust toolchain.
  tpmkey-helper:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        working-directory: native/tpmkey-helper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # GitHub-owned actions/cache@v4 only (this repo deliberately avoids
      # third-party actions like Swatinem/rust-cache for supply-chain
      # reasons — same stance as gating `stem` behind the `tor-control`
      # extra). Without this, both legs of the matrix recompile the crate
      # from scratch every run, including bindgen against libtss2 on Linux.
      - name: Cache cargo registry + target (tpmkey-helper)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tpmkey-helper/target
          key: ${{ runner.os }}-cargo-tpmkey-helper-${{ hashFiles('native/tpmkey-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tpmkey-helper-

      # The tss-esapi TPM backend only compiles on Linux and needs the libtss2
      # headers + libclang (bindgen). macOS excludes it via cfg, so skip there.
      - name: Install libtss2 (Linux — tss-esapi backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtss2-dev libclang-dev clang pkg-config

      - name: Toolchain info + components
        run: |
          rustup component add rustfmt clippy
          cargo --version
          rustc --version

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Check declared Rust 1.85 MSRV
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --all-targets

  # v2-OS2 Phase 2b: exercise the Linux-only tss-esapi TPM backend end to end
  # against a swtpm software TPM (generate / public_key / delete / ECDH parity).
  # The pure layer + cross-platform build are covered by tpmkey-helper above;
  # this job sets MORDRED_TPM_TEST=1 so the otherwise-skipped live tests run.
  # Single-threaded because the tests share one swtpm command server.
  tpmkey-helper-tpm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/tpmkey-helper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same rationale + key scheme as the tpmkey-helper job above (a
      # distinct key suffix so the two jobs don't race to save the same
      # cache entry when they finish around the same time).
      - name: Cache cargo registry + target (tpmkey-helper-tpm)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tpmkey-helper/target
          key: ${{ runner.os }}-cargo-tpmkey-helper-tpm-${{ hashFiles('native/tpmkey-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tpmkey-helper-tpm-

      - name: Install libtss2 + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtss2-dev libtss2-tcti-swtpm0 libclang-dev clang pkg-config \
            swtpm swtpm-tools tpm2-tools

      - name: Start swtpm software TPM
        run: |
          mkdir -p /tmp/swtpm-state
          swtpm socket --tpm2 \
            --tpmstate dir=/tmp/swtpm-state \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags startup-clear \
            --daemon
          for _ in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/2321) 2>/dev/null; then exec 3>&- 3<&-; break; fi
            sleep 0.25
          done

      - name: Toolchain info
        run: cargo --version

      - name: cargo test (TPM backend vs swtpm)
        env:
          TCTI: swtpm:host=127.0.0.1,port=2321
          MORDRED_TPM_TEST: "1"
        run: cargo test --locked -- --test-threads=1
