        run: .venv/bin/python tools/ci_evidence.py worker --policy ci-policy.json --os macos --python "$CI_PYTHON" --output worker.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-worker-evidence-macos-${{ needs.ci-policy.outputs.platform_python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker.json
          if-no-files-found: error
  windows-private-fs:
    name: windows-private-fs
    needs:
      - ci-policy
    if: needs.ci-policy.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.ci-policy.outputs.platform_python }}
          cache: pip
      - name: Download immutable run policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-policy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install scoped dependencies in an isolated venv
        id: install
        run: |-
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,keyvault,extension]" uv
          if ($LASTEXITCODE -ne 0) { throw "dependency install failed" }
      - name: Prepare checked Windows feedback home
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import os
          import uuid
          from pathlib import Path
          from mordred_hermes._private_fs import open_private_directory

          home = Path(os.environ["USERPROFILE"]) / ("mordred-critical-" + uuid.uuid4().hex)
          with open_private_directory(home, create=True):
              pass
          with open_private_directory(home / "mordred", create=True):
              pass
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"HERMES_HOME={home}\n")
          PY
        id: private_home
        shell: bash
      - name: Native ACL, path, publication and process tests
        id: native
        env:
          CI_MODE: ${{ needs.ci-policy.outputs.mode }}
        run: |-
          if ($env:CI_MODE -eq "final") {
            .\.venv\Scripts\python.exe tools/run_native_test_shard.py --shard-index 1 --shard-count 1 --junitxml native-windows.xml `
              tests/test_private_fs.py `
