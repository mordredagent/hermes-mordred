              tests/test_wizard_windows_excluded.py `
              tests/test_wizard_windows_uninstall.py `
              tests/test_windows_database_compat.py `
              tests/test_wizard_windows_native.py `
              tests/test_wizard_windows_telegram.py `
              tests/test_wizard_windows_telegram_native.py `
              tests/test_desktop_windows_api.py `
              tests/test_desktop_windows_native.py `
              tests/test_desktop_windows_page.py `
              tests/test_desktop_windows_logout.py `
              tests/test_desktop_windows_pm_compat.py `
              tests/test_desktop_windows_install.py `
              tests/extension/test_desktop_api.py `
              tests/extension/test_desktop_platform.py `
              tests/extension/test_extension_serve_shutdown.py `
              tests/test_desktop_capture.py
          } else {
            .\.venv\Scripts\python.exe tools/run_ci_native_tests.py --policy ci-policy.json --junitxml native-windows.xml
          }
          if ($LASTEXITCODE -ne 0) { throw "native tests failed" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-windows-${{ needs.ci-policy.outputs.platform_python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-windows.xml
          if-no-files-found: warn
      - name: Install Rust formatting and lint components
        id: winkey_tools
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
        run: |-
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { throw "Rust component install failed" }
      - name: Native formatting
        run: |-
          cargo fmt --manifest-path native/winkey-helper/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { throw "winkey_fmt failed" }
        id: winkey_fmt
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
      - name: Native lint
        run: |-
          cargo clippy --manifest-path native/winkey-helper/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "winkey_clippy failed" }
        id: winkey_clippy
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
      - name: Native tests (hardware tests explicitly ignored)
        run: |-
          cargo test --manifest-path native/winkey-helper/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw "winkey_test failed" }
        id: winkey_test
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
      - name: Install declared MSRV
        run: |-
          rustup toolchain install 1.85.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "winkey_msrv_install failed" }
        id: winkey_msrv_install
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
      - name: MSRV tests
        run: |-
          cargo +1.85.0 test --manifest-path native/winkey-helper/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw "winkey_msrv_test failed" }
        id: winkey_msrv_test
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
      - name: Windows discovery and real build/install tests
        env:
          MORDRED_WINKEY_BUILD_TEST: '1'
        run: |-
          .\.venv\Scripts\python.exe -m pytest tests/test_keyvault_winkey_helper.py tests/test_winkey_build.py tests/integration/test_keyvault_windows.py -o addopts='' -q
          if ($LASTEXITCODE -ne 0) { throw "winkey_python failed" }
        id: winkey_python
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'winkey')
      - name: Build a wheel from the sdist and smoke outside the checkout
        run: |
          .\.venv\Scripts\uv.exe build --sdist --out-dir dist-private-fs
          if ($LASTEXITCODE -ne 0) { throw 'sdist build failed' }
          $source = (Get-ChildItem dist-private-fs/*.tar.gz).FullName
          .\.venv\Scripts\uv.exe build --wheel $source --out-dir dist-private-fs
          if ($LASTEXITCODE -ne 0) { throw 'wheel build failed' }
          $wheel = (Get-ChildItem dist-private-fs/*.whl).FullName
          # RUNNER_TEMP is on a broadly writable data volume; use the checked profile.
          $smoke = Join-Path $env:USERPROFILE 'mordred-private-fs-wheel'
          python -m venv "$smoke/venv"
          if ($LASTEXITCODE -ne 0) { throw "wheel venv creation failed" }
          & "$smoke/venv/Scripts/python.exe" -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { throw 'wheel install failed' }
          $env:PYTHONPATH = ''
          @'
          from pathlib import Path
          import mordred_hermes
          from mordred_hermes._private_fs import open_private_directory
          from mordred_hermes.keyvault import extension_sign
          assert 'site-packages' in Path(mordred_hermes.__file__).parts
          with open_private_directory(Path.cwd() / 'private', create=True) as d, d.transaction() as tx:
              tx.create_bytes('secret', b'old')
              tx.replace_bytes('secret', b'new')
              assert d.read_bytes('secret', max_bytes=3) == b'new'
          extension_sign._ext_dir = lambda: Path.cwd() / 'wallet'
          selection = {'kind': 'raw', 'key_id': 'synthetic', 'envelope_id': 'test'}
          extension_sign.set_wallet(selection)
          assert extension_sign._load_wallet_cfg() == selection
          extension_sign.set_wallet(selection | {'envelope_id': 'replacement'})
          assert extension_sign._load_wallet_cfg()['envelope_id'] == 'replacement'
          from mordred_hermes._audit_io import audit_session, decode_audit_bytes
          from mordred_hermes._log_rotation import rotate_audit
          with audit_session(Path.cwd() / 'audit' / 'custom.log', create=True) as session:
              session.create('custom.log', b'{}\n')
              result = rotate_audit(session, '2026-10-08')
              snapshot = session.snapshot(result.gzip_name, max_bytes=1024)
          assert decode_audit_bytes(snapshot.data, max_output_bytes=3) == b'{}\n'
          print(mordred_hermes.__file__)
          '@ | Set-Content -LiteralPath "$smoke/check.py" -Encoding utf8
          Set-Location $smoke
          & "$smoke/venv/Scripts/python.exe" check.py
          if ($LASTEXITCODE -ne 0) { throw 'private filesystem wheel smoke failed' }
        id: wheel
        if: contains(fromJSON(needs.ci-policy.outputs.windows_packs), 'windows-wheel')
      - name: Record worker checks
        id: evidence
        if: always()
        shell: bash
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          CI_PYTHON: ${{ needs.ci-policy.outputs.platform_python }}
        working-directory: ${{ github.workspace }}
        run: .venv/Scripts/python.exe tools/ci_evidence.py worker --policy ci-policy.json --os windows --python "$CI_PYTHON" --output worker.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-worker-evidence-windows-${{ needs.ci-policy.outputs.platform_python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker.json
          if-no-files-found: error
  ci-acceptance:
    name: CI acceptance
    needs:
      - ci-policy
      - linux
      - macos
      - windows-private-fs
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download immutable run policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-policy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Download all worker manifests
        if: needs.ci-policy.outputs.mode != 'docs'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-worker-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker-evidence
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: needs.ci-policy.outputs.mode == 'docs'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install documentation test environment
        id: docs_install
        if: needs.ci-policy.outputs.mode == 'docs'
        run: |-
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -e ".[dev,keyvault,extension]"
      - name: Complete documentation contract checks
        id: docs_tests
        if: needs.ci-policy.outputs.mode == 'docs'
        run: >-
          .venv-docs/bin/python -m pytest -q tests/test_docs_links.py
          tests/test_ux_guidance_guard.py tests/test_packaging_versions.py tests/test_user_installer.py
      - name: Require the complete selected scope
        id: accept
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 tools/ci_evidence.py accept --policy ci-policy.json --workers worker-evidence --output evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-acceptance-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
