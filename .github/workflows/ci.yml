# Scope-aware CI: routine 3–5, documentation 2, final 6 jobs.
# Policy and positive acceptance are defined in docs/dev/CI.md.
# Keep PR event types stable: label-only runs can cancel actual testing.
name: CI
'on':
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
      - dev
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      linux_versions: ${{ steps.mode.outputs.linux_versions }}
      platform_python: ${{ steps.mode.outputs.platform_python }}
      support_python: ${{ steps.mode.outputs.support_python }}
      macos: ${{ steps.mode.outputs.macos }}
      windows: ${{ steps.mode.outputs.windows }}
      linux_packs: ${{ steps.mode.outputs.linux_packs }}
      macos_packs: ${{ steps.mode.outputs.macos_packs }}
      windows_packs: ${{ steps.mode.outputs.windows_packs }}
      windows_modules: ${{ steps.mode.outputs.windows_modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select cumulative change scope
        id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ci_test_policy.py --policy-file ci-policy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-policy.json
          if-no-files-found: error
  linux:
    name: linux (${{ matrix.python-version }})
    needs:
      - ci-policy
    if: needs.ci-policy.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.ci-policy.outputs.linux_versions) }}
    env:
      HERMES_HOME: /tmp/mordred-ci-linux-home
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Download immutable run policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-policy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install reduced-extras environment
        id: install
        run: |-
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev,keyvault,extension]"
      - name: ruff check and format
        id: ruff
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'static') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: |-
          .venv/bin/python -m ruff check src tests scripts tools
          .venv/bin/python -m ruff format --check src tests scripts tools
      - name: shellcheck
        id: shellcheck
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'static') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: shellcheck scripts/*.sh native/*/build.sh
      - name: SKILL.md drift guard (mordred-status)
        id: status
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'static') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: .venv/bin/hermes-mordred policy dry-run skills/mordred-status
      - name: mypy --strict with reduced extras
        id: mypy
        run: .venv/bin/python -m mypy --strict src tools scripts/keyvault_offline_digest.py
      - name: Default suite or draft critical feedback
        id: pytest
        env:
          CI_MODE: ${{ needs.ci-policy.outputs.mode }}
        run: |-
          if [ "$CI_MODE" = critical ]; then
            .venv/bin/python tools/run_critical_tests.py --junitxml critical-linux.xml
            .venv/bin/python -m pytest -q tests/test_ci_*.py tests/test_critical_test_runner.py tests/test_critical_test_home.py tests/test_native_test_shards.py
          else
            .venv/bin/python -m pytest -q --cov=mordred_hermes --cov-report=xml
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-linux-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            coverage.xml
            critical-linux.xml
          if-no-files-found: ignore
      - name: Install feature extras in a clean environment
        id: feature_install
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'features') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: |-
          python -m venv .venv-features
          .venv-features/bin/python -m pip install -e ".[dev,keyvault,extension,ethereum,messaging,tor-control,telegram]"
      - name: Require and exercise every feature dependency
        run: |
          .venv-features/bin/python - <<'PY'
          import contextlib
          import io

          import eth_account
          import eth_keys
          import qrcode
          import requests
          import rlp
          import socks
          import telethon
          import urllib3
          from stem.control import Controller

          from mordred_hermes.wizard.extension_pair_cli import _print_qr

          assert eth_account.Account
          assert eth_keys.keys.PrivateKey
          assert requests.Session
          assert rlp.encode
          assert socks.socksocket
          assert urllib3.HTTPSConnectionPool
          assert callable(Controller.from_port)
          assert telethon.TelegramClient

          qr = qrcode.QRCode(border=1)
          qr.add_data("MORT-CI000000-CI000000")
          qr.make(fit=True)
          assert qr.get_matrix()

          rendered = io.StringIO()
          with contextlib.redirect_stdout(rendered):
              _print_qr("MORT-CI000000-CI000000")
          assert rendered.getvalue().strip(), "messaging extra did not render a QR"
          PY
        id: feature_imports
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'features') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Run feature-extra suites
        env:
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        run: |
          .venv-features/bin/python -m pytest -q -rs \
            tests/test_keyvault_ethereum.py \
            tests/test_keyvault_bip32.py \
            tests/test_wizard_keyvault_eth_cli.py \
            tests/extension/test_extension_sign_tx.py \
            tests/test_paths_tor.py \
            tests/test_wizard_extension_pair_cli.py \
            tests/extension/test_telegram_import.py
        id: feature_tests
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'features') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Install declared Hermes floor in a clean environment
        id: floor_install
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'floor') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: |-
          python -m venv .venv-floor
          .venv-floor/bin/python -m pip install "hermes-agent==0.13.0"
          .venv-floor/bin/python -m pip install -e ".[dev,keyvault,extension]"
      - name: Guard — resolver must not have upgraded hermes-agent off the floor
        run: |
          set -euo pipefail
          INSTALLED_VERSION="$(.venv-floor/bin/python -c 'import importlib.metadata as m; print(m.version("hermes-agent"))')"
          if [ "$INSTALLED_VERSION" != "0.13.0" ]; then
            echo "::error::hermes-agent floor test is void: resolver left hermes-agent at $INSTALLED_VERSION instead of the pinned 0.13.0, so pyproject.toml's declared floor was not actually exercised."
            exit 1
          fi
        id: floor_guard
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'floor') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: pytest against the hermes-agent floor
        env:
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        run: .venv-floor/bin/python -m pytest -q --deselect tests/test_provider_identity.py::test_replica_matches_hermes_source --deselect tests/test_provider_transport_flagger.py::TestRegistrySync::test_known_provider_slugs_are_real_hermes_ids
        id: floor_tests
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'floor') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Build canonical and compatibility artifacts
        id: package_build
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'package') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: |-
          python -m venv .venv-package
          .venv-package/bin/python -m pip install build
          .venv-package/bin/python -m build --outdir dist
          .venv-package/bin/python -m build --outdir compat-dist packaging/mordred-hermes-compat
      - name: Fresh-install and smoke entry points plus shipped assets
        env:
          SMOKE_VENV: ${{ runner.temp }}/mordred-wheel-smoke
          SMOKE_HOME: ${{ runner.temp }}/mordred-wheel-home
        run: |
          set -euo pipefail
          wheel_path="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -type f)"
          wheel_count="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')"
          if [ "$wheel_count" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found $wheel_count"
            exit 1
          fi

          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          "$SMOKE_VENV/bin/python" -m pip install "${wheel_path}[keyvault,extension]"
          cd "$RUNNER_TEMP"

          HERMES_HOME="$SMOKE_HOME" "$SMOKE_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import os
          from pathlib import Path
          import sysconfig

          import mordred_hermes
          import mordred_hermes.extension.rpc
          import requests
          import socks
          import urllib3

          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          package_file = Path(mordred_hermes.__file__).resolve()
          assert not package_file.is_relative_to(checkout), package_file
          assert requests.Session
          assert socks.socksocket
          assert urllib3.HTTPSConnectionPool

          dist = importlib.metadata.distribution("hermes-mordred")
          plugin_eps = {
              ep.name: ep
              for ep in dist.entry_points
              if ep.group == "hermes_agent.plugins"
          }
          expected_plugins = {"mordred"}
          assert set(plugin_eps) == expected_plugins
          for name, entry_point in plugin_eps.items():
              module = entry_point.load()
              assert callable(getattr(module, "register", None)), name

          console_eps = {
              ep.name: ep
              for ep in dist.entry_points
              if ep.group == "console_scripts"
          }
          assert "hermes-mordred" in console_eps
          assert callable(console_eps["hermes-mordred"].load())

          package_root = importlib.resources.files("mordred_hermes")
          required_assets = (
              "_native/sekey-helper/build.sh",
              "_native/sekey-helper/Package.swift",
              "_native/tpmkey-helper/Cargo.lock",
              "_offline/keyvault_offline_digest.py",
              "extension/web/index.html",
          )
          for relative in required_assets:
              assert package_root.joinpath(relative).is_file(), relative

          pth = (
              Path(sysconfig.get_paths()["purelib"])
              / "mordred_hermes_config_decrypt.pth"
          )
          assert pth.is_file(), pth
          print(f"Installed wheel package: {package_file}")
          print(f"Validated plugins: {sorted(plugin_eps)}")
          print(f"Validated .pth: {pth}")
          PY

          HERMES_HOME="$SMOKE_HOME" "$SMOKE_VENV/bin/hermes-mordred" --version

          compat_wheel="$(find "$GITHUB_WORKSPACE/compat-dist" -maxdepth 1 -name '*.whl' -type f)"
          compat_wheel_count="$(find "$GITHUB_WORKSPACE/compat-dist" -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')"
          if [ "$compat_wheel_count" -ne 1 ]; then
            echo "::error::Expected exactly one compatibility wheel, found $compat_wheel_count"
            exit 1
          fi
          "$SMOKE_VENV/bin/python" -m pip install --no-index "$compat_wheel"
          "$SMOKE_VENV/bin/python" - <<'PY'
          import importlib.metadata

          canonical = importlib.metadata.distribution("hermes-mordred")
          compat = importlib.metadata.distribution("mordred-hermes")
          assert canonical.version == compat.version
          assert not compat.entry_points
          assert compat.files is not None
          assert all(".dist-info/" in str(path) for path in compat.files), compat.files
          PY
          "$SMOKE_VENV/bin/python" -m pip uninstall --yes mordred-hermes
          HERMES_HOME="$SMOKE_HOME" "$SMOKE_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import mordred_hermes

          assert importlib.metadata.version("hermes-mordred") == mordred_hermes.__version__
          PY
          HERMES_HOME="$SMOKE_HOME" "$SMOKE_VENV/bin/hermes-mordred" --version
        id: package_smoke
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'package') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Install integration extras in a clean environment
        id: integration_install
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tor') && matrix.python-version == needs.ci-policy.outputs.support_python
        run: |-
          python -m venv .venv-integration
          .venv-integration/bin/python -m pip install -e ".[dev,integration]"
      - name: Verify docker compose is available
        run: |
          docker --version
          docker compose version
          docker info --format '{{.ServerVersion}}'
        id: docker_verify
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tor') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Build Tor integration image
        working-directory: tests/integration/docker/tor
        run: docker compose build
        id: tor_build
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tor') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Run Tor + SOCKS5h + provider transport integration tests
        env:
          HERMES_HOME: /tmp/hermes-mordred-ci-home
        run: |
          .venv-integration/bin/python -m pytest -v -m integration \
            tests/integration/test_tor.py \
            tests/integration/test_socks5h_libs.py \
            tests/integration/test_provider_transport.py
        id: tor_tests
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tor') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Cache cargo registry + target (tpmkey-helper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tpmkey-helper/target
          key: ${{ runner.os }}-cargo-tpmkey-helper-${{ hashFiles('native/tpmkey-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tpmkey-helper-
        if: (contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python) || (contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'swtpm') && matrix.python-version == needs.ci-policy.outputs.support_python)
      - name: Install libtss2 + swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtss2-dev libtss2-tcti-swtpm0 libclang-dev clang pkg-config \
            swtpm swtpm-tools tpm2-tools
        id: tpm_system
        if: (contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python) || (contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'swtpm') && matrix.python-version == needs.ci-policy.outputs.support_python)
      - name: Toolchain info + components
        run: |
          rustup component add rustfmt clippy
          cargo --version
          rustc --version
        id: rust_tools
        if: (contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python) || (contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'swtpm') && matrix.python-version == needs.ci-policy.outputs.support_python)
        working-directory: native/tpmkey-helper
      - name: cargo fmt --check
        run: cargo fmt --check
        id: tpm_fmt
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python
        working-directory: native/tpmkey-helper
      - name: cargo clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings
        id: tpm_clippy
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python
        working-directory: native/tpmkey-helper
      - name: cargo test
        run: cargo test --locked
        id: tpm_test
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python
        working-directory: native/tpmkey-helper
      - name: Check declared Rust 1.85 MSRV
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --all-targets
        id: tpm_msrv
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'tpm') && matrix.python-version == needs.ci-policy.outputs.support_python
        working-directory: native/tpmkey-helper
      - name: Start swtpm software TPM
        run: |
          mkdir -p /tmp/swtpm-state
          swtpm socket --tpm2 \
            --tpmstate dir=/tmp/swtpm-state \
            --ctrl type=tcp,port=2322 \
            --server type=tcp,port=2321 \
            --flags startup-clear \
            --daemon
          for _ in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/2321) 2>/dev/null; then exec 3>&- 3<&-; break; fi
            sleep 0.25
          done
        id: swtpm_start
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'swtpm') && matrix.python-version == needs.ci-policy.outputs.support_python
        working-directory: native/tpmkey-helper
      - name: cargo test (TPM backend vs swtpm)
        env:
          TCTI: swtpm:host=127.0.0.1,port=2321
          MORDRED_TPM_TEST: '1'
        run: cargo test --locked -- --test-threads=1
        id: swtpm_rust
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'swtpm') && matrix.python-version == needs.ci-policy.outputs.support_python
        working-directory: native/tpmkey-helper
      - name: Build helper and validate Linux memory/Telegram against swtpm
        working-directory: ${{ github.workspace }}
        env:
          TCTI: swtpm:host=127.0.0.1,port=2321
          MORDRED_TPM_TEST: '1'
          HERMES_HOME: /tmp/mordred-ci-telegram-home
          MORDRED_LINUX_TELEGRAM_TEST: '1'
          MORDRED_TPMKEY_HELPER: ${{ github.workspace }}/native/tpmkey-helper/target/debug/mordred-hermes-tpmkey
        run: |
          cargo build --locked --manifest-path native/tpmkey-helper/Cargo.toml
          python -m venv .venv-swtpm
          .venv-swtpm/bin/python -m pip install -e ".[dev,keyvault,extension,telegram]"
          .venv-swtpm/bin/python -m pytest -v -o addopts="" tests/integration/test_linux_telegram_tpm.py
        id: swtpm_python
        if: contains(fromJSON(needs.ci-policy.outputs.linux_packs), 'swtpm') && matrix.python-version == needs.ci-policy.outputs.support_python
      - name: Record worker checks
        id: evidence
        if: always()
        shell: bash
        env:
          CI_STEPS_JSON: ${{ toJSON(steps) }}
          CI_PYTHON: ${{ matrix.python-version }}
        working-directory: ${{ github.workspace }}
        run: .venv/bin/python tools/ci_evidence.py worker --policy ci-policy.json --os linux --python "$CI_PYTHON" --output worker.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ci-worker-evidence-linux-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker.json
          if-no-files-found: error
  macos:
    name: macos
    needs:
      - ci-policy
    if: needs.ci-policy.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HERMES_HOME: /tmp/mordred-ci-macos-home
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ needs.ci-policy.outputs.platform_python }}
          cache: pip
      - name: Download immutable run policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-policy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install macOS reduced-extras environment
        id: install
        run: |-
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev,keyvault,extension,macos]"
      - name: mypy --strict with reduced extras
        id: mypy
        if: needs.ci-policy.outputs.mode != 'critical'
        run: .venv/bin/python -m mypy --strict src tools scripts/keyvault_offline_digest.py
      - name: SKILL.md drift guard (mordred-status)
        id: status
        run: .venv/bin/hermes-mordred policy dry-run skills/mordred-status
      - name: Default suite or draft critical feedback
        id: pytest
        env:
          CI_MODE: ${{ needs.ci-policy.outputs.mode }}
        run: |-
          if [ "$CI_MODE" = critical ]; then
            .venv/bin/python tools/run_critical_tests.py --junitxml critical-macos.xml
          else
            .venv/bin/python -m pytest -q --cov=mordred_hermes --cov-report=xml
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-macos-${{ needs.ci-policy.outputs.platform_python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            coverage.xml
            critical-macos.xml
          if-no-files-found: ignore
      - name: Swift toolchain info
        run: swift --version
        id: swift_info
        if: contains(fromJSON(needs.ci-policy.outputs.macos_packs), 'swift')
        working-directory: native/sekey-helper
      - name: Build Secure Enclave helper
        run: swift build -c release
        id: swift_build
        if: contains(fromJSON(needs.ci-policy.outputs.macos_packs), 'swift')
        working-directory: native/sekey-helper
      - name: Cache cargo registry + target (tpmkey-helper)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/tpmkey-helper/target
          key: ${{ runner.os }}-cargo-tpmkey-helper-${{ hashFiles('native/tpmkey-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tpmkey-helper-
        if: contains(fromJSON(needs.ci-policy.outputs.macos_packs), 'tpm')
      - name: Toolchain info + components
        run: |
          rustup component add rustfmt clippy
          cargo --version
          rustc --version
        id: rust_tools
        if: contains(fromJSON(needs.ci-policy.outputs.macos_packs), 'tpm')
        working-directory: native/tpmkey-helper
      - name: cargo fmt --check
        run: cargo fmt --check
        id: tpm_fmt
