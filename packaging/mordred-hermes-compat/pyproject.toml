[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mordred-hermes"
version = "0.1.0a19"
description = "Compatibility shim for the renamed hermes-mordred distribution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "InternetMaximalism" }]
license = { text = "MIT" }
dependencies = ["hermes-mordred==0.1.0a19"]

[project.optional-dependencies]
keyvault = ["hermes-mordred[keyvault]==0.1.0a19"]
extension = ["hermes-mordred[extension]==0.1.0a19"]
macos = ["hermes-mordred[macos]==0.1.0a19"]
ethereum = ["hermes-mordred[ethereum]==0.1.0a19"]
messaging = ["hermes-mordred[messaging]==0.1.0a19"]
tor-control = ["hermes-mordred[tor-control]==0.1.0a19"]
integration = ["hermes-mordred[integration]==0.1.0a19"]
dev = ["hermes-mordred[dev]==0.1.0a19"]

[project.urls]
Documentation = "https://github.com/mordredagent/hermes-mordred/tree/main/docs"
Source = "https://github.com/mordredagent/hermes-mordred"

# The compatibility distribution owns metadata only. Runtime modules and the
# hermes-mordred console script belong exclusively to the new distribution so
# uninstalling either project cannot delete files owned by the other one.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml"]
