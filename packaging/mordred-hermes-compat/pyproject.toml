[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mordred-hermes"
version = "0.3.0a7"
description = "Compatibility shim for the renamed hermes-mordred distribution"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "InternetMaximalism" }]
license = { text = "MIT" }
dependencies = ["hermes-mordred==0.3.0a7"]

[project.optional-dependencies]
dbcrypt = ["hermes-mordred[dbcrypt]==0.3.0a7"]
keyvault = ["hermes-mordred[keyvault]==0.3.0a7"]
extension = ["hermes-mordred[extension]==0.3.0a7"]
macos = ["hermes-mordred[macos]==0.3.0a7"]
ethereum = ["hermes-mordred[ethereum]==0.3.0a7"]
tor-control = ["hermes-mordred[tor-control]==0.3.0a7"]
telegram = ["hermes-mordred[telegram]==0.3.0a7"]
integration = ["hermes-mordred[integration]==0.3.0a7"]
dev = ["hermes-mordred[dev]==0.3.0a7"]

[project.urls]
Documentation = "https://github.com/mordredagent/hermes-mordred/tree/main/docs"
Source = "https://github.com/mordredagent/hermes-mordred"

# The compatibility distribution owns metadata only. Runtime modules and the
# hermes-mordred console script belong exclusively to the new distribution so
# uninstalling either project cannot delete files owned by the other one.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/pyproject.toml"]
