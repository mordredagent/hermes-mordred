<h2>Mordred を入れました</h2>
<p>ログインすると自動で起動します。ブラウザーで Mordred の拡張を開くと、自動でつながります。</p>
<p>バックアップファイルは「ダウンロード」フォルダーにあります（<code>mordred-keyvault-backup.mrkv</code>）。この Mac 以外の場所にコピーを保管し、人に見られないようにしてください。</p>
<p>インストールの詳しい記録は <code>~/Library/Logs/Mordred/install.log</code> にあります。</p>
</body></html>
