<h2>Mordred 已安装</h2>
<p>它会在你登录时自动启动。在浏览器中打开 Mordred 扩展：它会自动连接。</p>
<p>你的备份文件在“下载”文件夹中（<code>mordred-keyvault-backup.mrkv</code>）。请在这台 Mac 以外的地方保存一份副本，并注意保密。</p>
<p>安装详情记录在 <code>~/Library/Logs/Mordred/install.log</code> 中。</p>
</body></html>
