<html lang="zh-TW"><head><meta charset="utf-8"><style>body{font-family:-apple-system,sans-serif;font-size:13px;line-height:1.5}</style></head>
<body>
<h2>Mordred 已安裝</h2>
<p>登入時會自動啟動。在瀏覽器中打開 Mordred 延伸功能：它會自動連線。</p>
<p>你的備份檔案在「下載項目」檔案夾中（<code>mordred-keyvault-backup.mrkv</code>）。請在這台 Mac 以外的地方保存一份副本，並妥善保密。</p>
<p>安裝的詳細記錄位於 <code>~/Library/Logs/Mordred/install.log</code>。</p>
</body></html>
