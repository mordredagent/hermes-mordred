<h2>Mordred가 설치되었습니다</h2>
<p>로그인하면 자동으로 시작됩니다. 브라우저에서 Mordred 확장 프로그램을 열면 자동으로 연결됩니다.</p>
<p>백업 파일은 다운로드 폴더에 있습니다(<code>mordred-keyvault-backup.mrkv</code>). 이 Mac이 아닌 다른 곳에 사본을 보관하고, 다른 사람이 볼 수 없도록 하십시오.</p>
<p>설치에 대한 자세한 내용은 <code>~/Library/Logs/Mordred/install.log</code>에 있습니다.</p>
</body></html>
